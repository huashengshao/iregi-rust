[package]
name = "linnest"
version = "0.1.0"
edition = "2021"
description = "A library for working with linnet data structures in WebAssembly environments"
repository = "https://github.com/lcnbr/linnet"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ciborium = "0.2.2"
dot-parser = { version = "0.5", git = "https://github.com/alphal00p/gammaloop", rev = "865afdc43fb4e6b950439d34b4ec2c38352873e7" }
linnet = { git = "https://github.com/alphal00p/gammaloop", rev = "865afdc43fb4e6b950439d34b4ec2c38352873e7", default-features = false, features = ["drawing", "nodestore-vec", "rkyv", "serde"] }
rkyv = { version = "0.7", features = ["validation"] }
serde = { version = "1.0", features = ["derive"] }
self_cell = "1.2.2"
serde_json = { version = "1", features = ["float_roundtrip"] }

cgmath = { version = "0.18.0", features = ["serde"] }
figment = "0.10.19"
getrandom = { version = "0.2", default-features = false, features = ["custom"] }
indexmap = { version = "2.14.0", features = ["serde"] }
rand = "0.8.5"
thiserror = "2.0"
wasm-minimal-protocol = "0.2.0"
roxmltree = { version = "0.21.1", optional = true }
kurbo = { version = "0.13", optional = true }
# Native SVG drawing shares Kurvst's curve geometry with the Typst renderer.
kurvst = { git = "https://github.com/alphal00p/gammaloop", rev = "865afdc43fb4e6b950439d34b4ec2c38352873e7", optional = true }

[features]
projection-service = []
# Native SVG drawing of prepared graphs; Typst only typesets their labels.
svg = ["dep:kurbo", "dep:kurvst", "dep:roxmltree"]
custom = []
typst-plugin = ["custom"]

[[bin]]
name = "impred-project"
path = "src/bin/impred_project.rs"
required-features = ["projection-service"]

# Regression tests exercise integration with exact numeric JSON enabled.
[dev-dependencies]
serde_json = { version = "1", features = ["arbitrary_precision"] }
